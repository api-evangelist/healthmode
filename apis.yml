name: Healthmode
description: HealthMode was a machine-learning digital medicine company, founded in 2017 in San Francisco
  by Bradford Cross and Dan Karlin, that developed AI-enabled digital measurement methods to increase the
  precision and speed of clinical research. Its techniques improved phenotype understanding, streamlined
  screening and eligibility, enabled early detection of adverse events, and provided objective, low-burden
  efficacy endpoints for next-generation clinical trials. HealthMode was acquired by MindMed in 2021 and
  folded into MindMed's digital-medicine division (Albert); it no longer operates as an independent company,
  maintains no standalone website or public developer/API surface, and none of its former domains resolve.
